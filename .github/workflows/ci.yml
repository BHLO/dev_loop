name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: CLI 可用性
        run: python scripts/devloop.py --version

      - name: 行为测试
        run: python tests/test_devloop.py

      - name: 深度测试
        run: python tests/test_deep.py

      - name: 规则完整性
        run: python tests/test_skill_rules.py

      - name: 校验 SKILL.md 结构
        run: |
          python -c "
          import pathlib, sys
          text = pathlib.Path('SKILL.md').read_text(encoding='utf-8')
          assert text.startswith('---'), 'SKILL.md 缺少 frontmatter'
          head = text.split('---')[1]
          for field in ('name: dev-loop', 'description:', 'agent_created:'):
              assert field in head, f'缺少字段 {field}'
          print('SKILL.md ok')
          "
